// A conservative explainable forecast: attendance history, weekday and menu effect, poll signal, and correction from actual feedback.
const baseRates={breakfast:[.65,.68,.67,.72,.7,.76,.61],lunch:[.72,.7,.75,.69,.73,.62,.82],snacks:[.55,.61,.59,.66,.62,.68,0],dinner:[.78,.76,.84,.8,.77,.69,.8]};const days=Object.keys(week);const popular=['paneer','bhature','pav bhaji','gulab jamun','ice cream','biryani','jalebi'];const unpopular=['lauki','pumpkin'];
function forecast(day,meal){const index=days.indexOf(day),dateKey=day+'-'+meal,menu=week[day][meal].toLowerCase(),res=state.residents,base=baseRates[meal][index],boost=popular.some(x=>menu.includes(x))?.055:unpopular.some(x=>menu.includes(x))?-.055:0;const vote=state.votes[dateKey]||{yes:0,no:0,maybe:0},cast=vote.yes+vote.no+vote.maybe,unvoted=Math.max(0,res-cast),prior=Math.max(0,Math.min(.95,base+boost));let predicted=prior*res;if(cast){const voteSignal=vote.yes*.86+vote.maybe*.48+vote.no*.06+unvoted*prior;const blend=Math.min(.75,.20+.55*cast/res);predicted=blend*voteSignal+(1-blend)*predicted}const feedback=Object.entries(state.actuals).filter(([k,v])=>k.endsWith('-'+meal)&&v.actual>=0);if(feedback.length){const correction=feedback.reduce((s,[k,v])=>s+(v.actual-v.predicted)/Math.max(1,v.eligible),0)/feedback.length;predicted+=res*Math.max(-.12,Math.min(.12,correction*.55))}const pred=Math.max(0,Math.min(res,Math.round(predicted))),uncertainty=Math.round(res*(feedback.length>=3?.07:.12));return {pred,low:Math.max(0,pred-uncertainty),high:Math.min(res,pred+uncertainty),base,boost,vote,cast,prior,feedback:feedback.length,menu:week[day][meal]}}
function mess(){const f=forecast(state.day,state.meal),tomorrow=days[(days.indexOf(state.day)+1)%7],next=forecast(tomorrow,state.meal),diff=next.pred-f.pred,pct=Math.abs(Math.round(diff/Math.max(1,f.pred)*100)),choice=state.day+'-'+state.meal,feedback=state.actuals[choice];return `${head('MEASURABLE CAMPUS IMPACT','Tomorrow, prepared better.','A real forecasting workflow: student intentions + menu preferences + historical attendance + kitchen feedback.')}<div class="tabs">${[['forecast','Kitchen insights'],['poll','Student poll'],['menu','Weekly mess menu'],['history','Forecast history']].map(x=>`<button class="tab ${state.foodTab===x[0]?'active':''}" data-action="messTab" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>${state.foodTab==='menu'?`<div class="card"><div class="between wrap"><h3>Junior boys' mess — actual weekly schedule</h3><a href="junior-mess-menu.pdf" target="_blank" class="btn outline">Original menu PDF ↗</a></div><div class="daytabs">${days.map(d=>`<button data-action="day" data-id="${d}" class="${d===state.day?'active':''}">${d.slice(0,3)}</button>`).join('')}</div>${['breakfast','lunch','snacks','dinner'].map(m=>`<div class="menuitem"><b>${m[0].toUpperCase()+m.slice(1)}</b><p>${escapeHTML(week[state.day][m])}</p></div>`).join('')}</div>`:state.foodTab==='poll'?`<div class="grid g2"><div class="card"><span class="eyebrow">STUDENT INTENT</span><h2 style="margin:10px 0">Will you eat this meal?</h2><p class="muted">${state.day} ${state.meal} · ${escapeHTML(f.menu)}</p><div class="row wrap mt">${[['yes','Yes, I’ll eat'],['maybe','Maybe'],['no','No']].map(x=>`<button class="btn ${state.votes[choice]?.mine===x[0]?'primary':'outline'}" data-action="vote" data-id="${x[0]}">${x[1]}</button>`).join('')}</div><p class="mini">Demo vote stored in your browser. Each sample user can vote once per meal.</p></div><div class="card"><span class="eyebrow">CURRENT SIGNAL</span><h2 class="mt2">${f.cast} / ${state.residents}</h2><div class="progress"><span style="width:${Math.round(f.cast/state.residents*100)}%"></span></div><p class="muted">${f.vote.yes} yes · ${f.vote.maybe} maybe · ${f.vote.no} no</p><div class="note">Votes are intentions, not verified attendance. The forecast keeps a historical baseline when few students vote.</div></div></div>`:state.foodTab==='history'?`<div class="card"><h3>Feedback and calibration history</h3><p class="muted">Actual attendance entries submitted by the demo mess manager.</p><div class="tablewrap"><table><thead><tr><th>Meal</th><th>Forecast</th><th>Actual</th><th>Absolute error</th></tr></thead><tbody>${Object.entries(state.actuals).map(([key,v])=>`<tr><td>${escapeHTML(key)}</td><td>${v.predicted}</td><td>${v.actual}</td><td>${Math.abs(v.actual-v.predicted)} students</td></tr>`).join('')||'<tr><td colspan="4">No actual attendance recorded yet. Use Kitchen insights to add feedback.</td></tr>'}</tbody></table></div><div class="note mt2">After recording actual attendance, the next forecast incorporates a bounded correction. This is a demo model, not validated prediction accuracy.</div></div>`:`<div class="grid g2"><div class="card"><div class="between wrap"><span class="eyebrow">KITCHEN CONTROL ROOM</span><span class="pill demo">Sample data · not live attendance</span></div><div class="grid g2 mt2"><label class="field">Day<select id="day">${days.map(d=>`<option ${d===state.day?'selected':''}>${d}</option>`).join('')}</select></label><label class="field">Meal<select id="meal">${['breakfast','lunch','snacks','dinner'].map(m=>`<option ${m===state.meal?'selected':''}>${m}</option>`).join('')}</select></label></div><label class="field">Eligible residents<input id="residents" type="number" min="10" max="1000" value="${state.residents}"></label><span class="eyebrow">PREPARE FOR APPROXIMATELY</span><div class="between mt2"><div><div class="metric good">${f.pred} <span style="font-size:17px">meals</span></div><div class="mini">Estimated range ${f.low}–${f.high} meals</div></div><span style="font-size:54px">🍛</span></div><div class="progress"><span style="width:${Math.round(f.pred/state.residents*100)}%"></span></div><p class="muted">${Math.round(f.pred/state.residents*100)}% estimated attendance · ${f.cast} recorded poll responses</p><div class="sep"></div><span class="eyebrow">NEXT DAY COMPARISON</span><h3 style="margin:12px 0">${tomorrow}: ${next.pred} meals</h3><div class="metric ${diff<0?'warn':'good'}">${diff<0?'↓':diff>0?'↑':'→'} ${pct}%</div><p class="muted">${diff<0?`Prepare approximately ${Math.abs(diff)} fewer meals than ${state.day}.`:diff>0?`Prepare approximately ${diff} more meals than ${state.day}.`:'Estimated demand is unchanged.'} Adjust only after checking the uncertainty range.</p></div><div class="card"><span class="eyebrow">WHY THE FORECAST CHANGED</span><h2 style="margin:10px 0 14px">Decisions, not just votes.</h2><div class="reason"><span class="number">01</span><div><b>Day-of-week attendance pattern</b><p>Historical demonstration baseline for ${state.day} ${state.meal}: ${Math.round(f.base*100)}%. Tomorrow's baseline: ${Math.round(next.base*100)}%.</p></div></div><div class="reason"><span class="number">02</span><div><b>Menu preference signal</b><p>${f.boost>0?'A popular menu item raises the baseline.':f.boost<0?'A lower-demand dish reduces the baseline.':'No menu preference adjustment for this meal.'} Tomorrow: ${next.boost>0?'popular-item uplift':next.boost<0?'lower-demand adjustment':'neutral menu effect'}.</p></div></div><div class="reason"><span class="number">03</span><div><b>Student poll and actual feedback</b><p>${f.cast} poll responses for this meal. ${f.feedback} prior actual-attendance entries are available for correction.</p></div></div><div class="note"><b>Kitchen recommendation:</b> Plan around ${next.pred} portions for ${tomorrow} ${state.meal}, but keep the ${next.low}–${next.high} uncertainty range in view. Check inventory and record actual turnout before the next forecast.</div><div class="sep"></div><span class="eyebrow">CLOSE THE FEEDBACK LOOP</span><label class="field mt2">Actual attendance after service<input id="actual" type="number" min="0" max="${state.residents}" placeholder="e.g. 148" value="${feedback?.actual??''}"></label><button class="btn primary" data-action="recordActual">Record turnout & recalibrate ↗</button><p class="mini">For demo purposes, manager controls are visible without login. Production must restrict this to staff.</p></div></div>`}`}
function cafePage(){const categories=['All',...new Set(cafe.map(x=>x.category))],filtered=cafe.filter(x=>(state.selectedCategory==='All'||x.category===state.selectedCategory)&&x.name.toLowerCase().includes(state.cafeSearch.toLowerCase())),total=cafe.reduce((s,x)=>s+(state.cart[x.id]||0)*(x.price||0),0),count=Object.values(state.cart).reduce((a,b)=>a+b,0);return `${head('ACTUAL K.J CAFE MENU','Your café, minus the queue.','Prices transcribed from your photographed K.J Cafe menu. Browse, order, and simulate preparation-to-pickup status.')}<div class="grid g2"><div><div class="card"><div class="between"><div><span class="eyebrow">MENU SOURCE</span><h3 style="margin:8px 0">K.J Cafe · campus counter</h3><p class="mini">Items marked MRP require counter confirmation. Menu prices may change.</p></div><a href="cafe-menu-reference.jpeg" target="_blank" class="btn outline">See photo ↗</a></div><img class="menu-photo" src="cafe-menu-reference.jpeg" alt="Original K.J Cafe photographed price board" loading="lazy"></div><div class="mt2"><input id="cafeSearch" placeholder="Search momos, maggi, paratha..." value="${escapeHTML(state.cafeSearch)}"></div><div class="tabs">${categories.map(x=>`<button class="tab ${x===state.selectedCategory?'active':''}" data-action="category" data-id="${x}">${x}</button>`).join('')}</div><div class="grid g2">${filtered.map(x=>`<div class="card hover"><div class="foodcard"><span class="foodicon">${x.icon}</span><div><h3>${escapeHTML(x.name)}</h3><p>${x.category}</p><span class="foodprice">${x.price==null?'MRP':rupees(x.price)}</span></div></div><div class="between mt2">${x.price==null?'<span class="mini">Ask at counter</span>':`<div class="qty"><button data-action="qty" data-id="${x.id}" data-value="-1">−</button><strong>${state.cart[x.id]||0}</strong><button data-action="qty" data-id="${x.id}" data-value="1">+</button></div>`}<span class="pill">${x.price==null?'Not priced':'Pickup'}</span></div></div>`).join('')}</div></div><div><div class="card" style root.addEventListener('change',e=>{if(e.target.id==='user'){state.user=+e.target.value;toast('Switched fictional demo profile')}if(e.target.id==='day'){state.day=e.target.value;render()}if(e.target.id==='meal'){state.meal=e.target.value;render()}if(e.target.id==='residents'){state.residents=Math.min(1000,Math.max(10,+e.target.value||200));render()}});
root.addEventListener('input',e=>{if(e.target.id==='marketSearch'){state.search=e.target.value;let pos=e.target.selectionStart;render();let el=$('#marketSearch');el?.focus();el?.setSelectionRange(pos,pos)}if(e.target.id==='cafeSearch'){state.cafeSearch=e.target.value;let pos=e.target.selectionStart;render();let el=$('#cafeSearch');el?.focus();el?.setSelectionRange(pos,pos)}});
root.addEventListener('click',e=>{const navEl=e.target.closest('[data-nav]');if(navEl){go(navEl.dataset.nav);return}const el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id;if(a==='close'){if(e.target.closest('.modal')&&e.target===el.closest('.modalbg'))return;state.modal=null;render();return}if(a==='theme'){state.dark=!state.dark;render();return}if(a==='messTab'){state.foodTab=id;render();return}if(a==='day'){state.day=id;render();return}if(a==='category'){state.selectedCategory=id;render();return}if(a==='qty'){state.cart[id]=Math.max(0,(state.cart[id]||0)+Number(el.dataset.value));render();return}if(a==='placeOrder'){const total=cafe.reduce((s,x)=>s+(state.cart[x.id]||0)*(x.price||0),0);if(!total)return;state.orders.push({id:Math.floor(1000+Math.random()*9000),total,items:Object.values(state.cart).reduce((a,b)=>a+b,0),status:'Placed'});state.cart={};toast('Demo order placed — follow pickup status');return}if(a==='advance'){let o=state.orders.find(x=>x.id==id);if(o){let steps=['Placed','Accepted','Preparing','Ready','Collected'];o.status=steps[Math.min(4,steps.indexOf(o.status)+1)];toast('Sample order: '+o.status)}return}if(a==='vote'){const key=state.day+'-'+state.meal;let v=state.votes[key]||{yes:12,no:4,maybe:5};if(v.mine)v[v.mine]=Math.max(0,v[v.mine]-1);v[id]=(v[id]||0)+1;v.mine=id;state.votes[key]=v;toast('Meal preference updated');return}if(a==='recordActual'){const val=$('#actual')?.value;if(val===''||Number(val)<0||Number(val)>state.residents){toast('Enter valid attendance between 0 and eligible residents');return}let f=forecast(state.day,state.meal);state.actuals[state.day+'-'+state.meal]={actual:Number(val),predicted:f.pred,eligible:state.residents};toast('Actual attendance saved; forecast recalibrated');return}if(a==='request'){let x=state.items.find(x=>x.id==id);state.bookings.push({name:x.name,id:x.id});toast('Request sent to sample owner');return}if(a==='modal'){state.modal=id;render();return}if(a==='apply'){state.modal='apply';state.modalId=+id;render();return}if(a==='join'){let n=+id;state.joins=state.joins.includes(n)?state.joins.filter(x=>x!==n):[...state.joins,n];toast(state.joins.includes(n)?'Joined learning circle':'Left learning circle');return}if(a==='message'||a==='ride'){toast('Example request recorded in preview');return}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='listingForm'){let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;state.items.unshift({id:Date.now(),name,emoji:'📦',price:Number(f.get('price'))||0,unit:f.get('type')==='Rent'?'/hour':'',type:f.get('type'),owner:state.user,cat:'Community',tone:'green'});state.modal=null;toast('Your demo listing is now visible');return}if(e.target.id==='applyForm'){if(!state.applications.includes(state.modalId))state.applications.push(state.modalId);state.modal=null;toast('Freelance application submitted') }});
render();
</script></body></html>
